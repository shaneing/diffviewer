[package]
name = "diff_viewer"
version = "0.1.0"
description = "Offline desktop diff viewer"
authors = ["diffviewer"]
edition = "2021"

[lib]
name = "diff_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
